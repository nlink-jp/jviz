<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jviz</title>
  <script src="/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #7c8cff;
      letter-spacing: 0.05em;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.78rem;
      color: #888;
      white-space: nowrap;
    }

    select {
      background: #252836;
      color: #e0e0e0;
      border: 1px solid #3a3d4e;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: #7c8cff; }

    .status {
      margin-left: auto;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }
    .dot.connected { background: #4caf50; }
    .dot.error     { background: #f44336; }

    #main {
      flex: 1;
      overflow: hidden;
      padding: 16px;
    }

    .chart-wrapper {
      width: 100%;
      height: 100%;
      background: #1a1d27;
      border-radius: 8px;
      border: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: auto;
    }

    canvas { display: block; }

    /* Table view */
    #table-view {
      display: none;
      width: 100%;
      overflow: auto;
      padding: 16px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.85rem;
    }

    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid #2a2d3a;
      white-space: nowrap;
    }

    th {
      background: #252836;
      color: #7c8cff;
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    tr:hover td { background: #252836; }

    .empty-msg {
      color: #555;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>jviz</h1>
    <div class="controls">
      <div class="control-group">
        <label for="chart-type">Type</label>
        <select id="chart-type">
          <option value="bar">Bar</option>
          <option value="line">Line</option>
          <option value="pie">Pie</option>
          <option value="table">Table</option>
        </select>
      </div>
      <div class="control-group">
        <label for="x-axis">X / Label</label>
        <select id="x-axis"><option value="">—</option></select>
      </div>
      <div class="control-group">
        <label for="y-axis">Y / Value</label>
        <select id="y-axis"><option value="">—</option></select>
      </div>
    </div>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">connecting…</span>
    </div>
  </header>

  <div id="main">
    <div class="chart-wrapper" id="chart-wrapper">
      <span class="empty-msg" id="empty-msg">Waiting for data…</span>
      <canvas id="chart" style="display:none"></canvas>
    </div>
    <div id="table-view">
      <table id="data-table"><thead></thead><tbody></tbody></table>
    </div>
  </div>

  <script>
  (() => {
    let rows = [];
    let chart = null;

    const dot        = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const chartType  = document.getElementById('chart-type');
    const xAxis      = document.getElementById('x-axis');
    const yAxis      = document.getElementById('y-axis');
    const canvas     = document.getElementById('chart');
    const emptyMsg   = document.getElementById('empty-msg');
    const chartWrap  = document.getElementById('chart-wrapper');
    const tableView  = document.getElementById('table-view');
    const dataTable  = document.getElementById('data-table');

    // --- Palette ---
    const COLORS = [
      '#7c8cff','#ff7c7c','#7cffb2','#ffd77c','#d77cff',
      '#7cd4ff','#ff9f7c','#b2ff7c','#ff7cce','#7cffe8',
    ];

    function rgba(hex, a) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }

    // --- Column helpers ---
    function getColumns() {
      if (!rows.length) return [];
      return Object.keys(rows[0]);
    }

    function isNumericCol(col) {
      return rows.every(r => r[col] !== undefined && r[col] !== '' && !isNaN(Number(r[col])));
    }

    function updateSelectors() {
      const cols = getColumns();
      const prevX = xAxis.value;
      const prevY = yAxis.value;

      xAxis.innerHTML = '<option value="">—</option>';
      yAxis.innerHTML = '<option value="">—</option>';

      cols.forEach(c => {
        xAxis.innerHTML += `<option value="${c}"${c===prevX?' selected':''}>${c}</option>`;
        yAxis.innerHTML += `<option value="${c}"${c===prevY?' selected':''}>${c}</option>`;
      });

      // Auto-select reasonable defaults if nothing was chosen
      if (!prevX || !cols.includes(prevX)) {
        xAxis.value = cols[0] || '';
      }
      if (!prevY || !cols.includes(prevY)) {
        const numCol = cols.find(isNumericCol);
        yAxis.value = numCol || (cols[1] ?? cols[0] ?? '');
      }
    }

    // --- Render ---
    function render() {
      const type = chartType.value;

      // Show/hide panels
      const showTable = (type === 'table');
      chartWrap.style.display = showTable ? 'none' : 'flex';
      tableView.style.display = showTable ? 'block' : 'none';

      if (!rows.length) {
        emptyMsg.style.display = 'block';
        canvas.style.display = 'none';
        return;
      }

      if (showTable) {
        renderTable();
        return;
      }

      emptyMsg.style.display = 'none';
      canvas.style.display   = 'block';

      const xCol = xAxis.value;
      const yCol = yAxis.value;

      if (!xCol || !yCol) return;

      const labels  = rows.map(r => String(r[xCol] ?? ''));
      const values  = rows.map(r => Number(r[yCol]) || 0);

      if (chart) {
        chart.destroy();
        chart = null;
      }

      const ctx = canvas.getContext('2d');

      // Resize canvas to fill wrapper
      const wrapRect = chartWrap.getBoundingClientRect();
      canvas.width  = wrapRect.width  - 32;
      canvas.height = wrapRect.height - 32;

      Chart.defaults.color = '#888';
      Chart.defaults.borderColor = '#2a2d3a';

      if (type === 'pie') {
        chart = new Chart(ctx, {
          type: 'pie',
          data: {
            labels,
            datasets: [{
              data: values,
              backgroundColor: labels.map((_, i) => rgba(COLORS[i % COLORS.length], 0.8)),
              borderColor:     labels.map((_, i) => COLORS[i % COLORS.length]),
              borderWidth: 1,
            }],
          },
          options: {
            responsive: false,
            plugins: {
              legend: { position: 'right', labels: { boxWidth: 12, padding: 14 } },
            },
          },
        });
      } else {
        chart = new Chart(ctx, {
          type,
          data: {
            labels,
            datasets: [{
              label: yCol,
              data: values,
              backgroundColor: rgba(COLORS[0], 0.6),
              borderColor:     COLORS[0],
              borderWidth: type === 'line' ? 2 : 1,
              pointRadius:     type === 'line' ? 3 : 0,
              fill:            type === 'line',
              tension:         0.3,
            }],
          },
          options: {
            responsive: false,
            animation: { duration: 200 },
            scales: {
              x: { ticks: { maxRotation: 45, autoSkip: true, maxTicksLimit: 20 } },
              y: { beginAtZero: true },
            },
            plugins: { legend: { display: false } },
          },
        });
      }
    }

    function renderTable() {
      const cols = getColumns();
      const thead = dataTable.querySelector('thead');
      const tbody = dataTable.querySelector('tbody');

      thead.innerHTML = '<tr>' + cols.map(c => `<th>${escHtml(c)}</th>`).join('') + '</tr>';
      tbody.innerHTML = rows.map(r =>
        '<tr>' + cols.map(c => `<td>${escHtml(String(r[c] ?? ''))}</td>`).join('') + '</tr>'
      ).join('');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // --- SSE ---
    function connect() {
      const es = new EventSource('/events');

      es.onopen = () => {
        dot.className = 'dot connected';
        statusText.textContent = 'live';
      };

      es.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (Array.isArray(data)) {
            rows = data;
            updateSelectors();
            render();
          }
        } catch (_) {}
      };

      es.onerror = () => {
        dot.className = 'dot error';
        statusText.textContent = 'reconnecting…';
        es.close();
        setTimeout(connect, 2000);
      };
    }

    // --- Initial data fetch (handles page reload while server is up) ---
    fetch('/data')
      .then(r => r.json())
      .then(data => {
        if (Array.isArray(data) && data.length) {
          rows = data;
          updateSelectors();
          render();
        }
      })
      .catch(() => {})
      .finally(connect);

    // --- Controls ---
    chartType.addEventListener('change', render);
    xAxis.addEventListener('change', render);
    yAxis.addEventListener('change', render);

    // Re-render on window resize
    window.addEventListener('resize', () => { if (rows.length) render(); });
  })();
  </script>
</body>
</html>
